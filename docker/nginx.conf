server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly; fall back to index.html for client-side
    # routing (react-router etc.) instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; CRA/Vite fingerprint filenames.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
